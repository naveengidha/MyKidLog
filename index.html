<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>KidLog</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#4f46e5" />
  <link rel="stylesheet" href="css/style.css" />

  <!-- jsPDF + AutoTable -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
</head>
<body>

  <!-- Profile setup modal (shown on first launch) -->
  <div id="profile-modal" class="modal-overlay hidden">
    <div class="modal-sheet">
      <h2 class="modal-title">Welcome to KidLog</h2>
      <p class="modal-subtitle">Add your first client to get started.</p>
      <label class="field-label">Client name
        <input id="profile-name" type="text" class="text-input" placeholder="e.g. Alex" />
      </label>
      <label class="field-label">Date of birth (optional)
        <input id="profile-dob" type="date" class="text-input" />
      </label>
      <button id="profile-save" class="btn-primary">Get started</button>
    </div>
  </div>

  <!-- Main app -->
  <div id="app">
    <!-- View container — swapped by router -->
    <main id="view"></main>

    <!-- Bottom nav -->
    <nav class="bottom-nav">
      <button class="nav-item active" data-view="daily">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        <span>Day</span>
      </button>
      <button class="nav-item" data-view="weekly">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="9" y1="10" x2="9" y2="22"/><line x1="15" y1="10" x2="15" y2="22"/></svg>
        <span>Week</span>
      </button>
      <button class="nav-item" data-view="report">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
        <span>Report</span>
      </button>
      <button class="nav-item" data-view="profile">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
        <span>Profile</span>
      </button>
    </nav>
  </div>

  <!-- Log activity bottom sheet (shared across views) -->
  <div id="log-overlay" class="modal-overlay hidden">
    <div id="log-sheet" class="modal-sheet log-sheet"></div>
  </div>

  <script type="module" src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
